# 研究方向简述（用于 LLM 评分 prompt）
research_focus: |
  消化内科临床与内镜方向。核心关注：（1）急性/慢性胰腺炎的诊治，包括重症胰腺炎的阶梯治疗、
  内镜下坏死清除术等；（2）消化道出血的内镜下止血与药物治疗，包括静脉曲张与非静脉曲张性出血；
  （3）消化道早癌（食管/胃/结直肠）的内镜诊断与ESD/EMR治疗；（4）ERCP、EUS等高级内镜技术
  的临床应用与技术创新。

# ===== 追踪作者/机构 =====
authors: []

# ===== 排除词 =====
exclude:
  # --- 第6层：排除词 ---
  - "veterinary"
  - "plant biology"
  - "food science"
  - "canine"
  - "feline"
  - "murine"
  - "pancreatic cancer"
  - "hepatocellular carcinoma"
  - "pediatric pancreatitis"

# ===== 检索频率 =====
# 脚本自节流：cron 触发后若距上次成功不足 frequency×0.9 则自动跳过
schedule:
  frequency: daily
  custom_days: 7
  times: ["08:00"]

# ===== 时区 =====
timezone: "Asia/Shanghai"

# ===== 数据源开关 =====
sources:
  pubmed: true
  semantic_scholar: true
  openalex: true
  biorxiv: true
  medrxiv: true
  arxiv: true
  x_search: true
  rss: false

# ===== API 配置 =====
api_keys:
  pubmed_api_key: ""
  semantic_scholar_key: ""
  openalex_mailto: ""
  crossref_mailto: ""

# ===== LLM 配置（DeepSeek）=====
llm:
  base_url: "https://api.deepseek.com/v1"
  api_key: "REPLACE_WITH_SECRET"
  model: "deepseek-chat"
  timeout: 30

# ===== RSS 订阅 =====
rss_feeds: []

# ===== 推送渠道 =====
push:
  channel: "webhook"
  webhook_url: "http://localhost:9999/academic-radar-push"

# ===== 输出限制 =====
output:
  max_items: 10
  format: "plain"

# ===== 跨周期去重 =====
dedup:
  cross_period: true
  lookback_days: 30

# ===== 存档保留天数 =====
archive_retention_days: 30
