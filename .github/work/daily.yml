name: Daily Academic Radar

on:
  schedule:
    # 每天北京时间 00:00 = UTC 16:00
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install PyYAML requests python-dateutil feedparser openai tzdata

      - name: Replace API key in config
        env:
          DK: ${{ secrets.DEEPSEEK_API_KEY }}
        run: sed -i "s|REPLACE_WITH_SECRET|$DK|g" radar/academic_radar_config.yaml

      - name: Run radar main
        run: |
          cd radar
          mkdir -p data/radar state
          python radar_main.py

      - name: Fetch journals
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/journal_fetcher.py

      - name: Fetch patents
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/patent_fetcher.py

      - name: Generate final data
        env:
          RADAR_DIR: ${{ github.workspace }}/radar
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/generate_data.py

      - name: Commit and push data
        run: |
          git config user.name "Academic Radar Bot"
          git config user.email "bot@academic-radar.local"
          git add webapp/data/ radar/data/
          git diff --staged --quiet || git commit -m "Daily update $(TZ='Asia/Shanghai' date +%Y-%m-%d)"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './webapp'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
